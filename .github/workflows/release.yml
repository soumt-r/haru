name: Release

# Pushing a tag like v0.1.0 builds haru for every platform and publishes a GitHub
# Release. Running the workflow by hand (workflow_dispatch) does the same builds
# and checks but publishes nothing: download the artifacts to look at them.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# What a release contains, per platform:
#   haru-<version>-<os>-<arch>.tar.gz (.zip on Windows)
#     haru                   the command, with the standard modules and the
#                            bundled packages (timezone, http_server) inside
#     LICENSE, README.md, README.ja.md
#   checksums.txt
jobs:
  build:
    name: Build ${{ matrix.os_name }}/${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, os_name: linux, arch: amd64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, os_name: linux, arch: arm64 }
          - { os: macos-latest, target: aarch64-apple-darwin, os_name: darwin, arch: arm64 }
          - { os: macos-latest, target: x86_64-apple-darwin, os_name: darwin, arch: amd64 } # cross-compiled
          - { os: windows-latest, target: x86_64-pc-windows-msvc, os_name: windows, arch: amd64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "VERSION=dev-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - name: Build haru
        run: cargo build --release --locked -p haru-cli --target ${{ matrix.target }}

      # Cannot run an x86_64 macOS binary on the arm64 runner reliably, so that one is not run.
      - name: Try the build
        if: ${{ matrix.target != 'x86_64-apple-darwin' }}
        run: |
          ext=""; [ "${{ matrix.os_name }}" = windows ] && ext=".exe"
          haru="$PWD/target/${{ matrix.target }}/release/haru${ext}"
          mkdir -p try && cd try
          "$haru" version
          printf '<더하기>를 만들자 ([숫자]인 %s, [숫자]인 %s):\n    %s + %s를 돌려주자\n<더하기>(1, 2)를 출력하자\n' "'가'" "'나'" "'가'" "'나'" > add.hr
          "$haru" run add.hr | grep -Fx "3"
          printf '<피보>를 만들자 (%s):\n    만약 (%s < 2) 라면:\n        %s를 돌려주자\n    (<피보>(%s - 1) + <피보>(%s - 2))를 돌려주자\n<피보>(25)를 출력하자\n' "'n'" "'n'" "'n'" "'n'" "'n'" > fib.hr
          "$haru" run fib.hr | grep -Fx "75025"
          "$haru" run --no-jit fib.hr | grep -Fx "75025"
          printf '[timezone]에서 <시간대서식>을 가져오자\n<시간대서식>(0, "YYYY-MM-DD HH:mm", "Asia/Seoul")를 출력하자\n' > tz.hr
          "$haru" run tz.hr | grep -F "1970-01-01 09:00"
          cd .. && rm -rf try

      - name: Assemble the release files
        run: |
          ext=""; [ "${{ matrix.os_name }}" = windows ] && ext=".exe"
          name="haru-${VERSION}-${{ matrix.os_name }}-${{ matrix.arch }}"
          mkdir -p dist/haru dist/out
          cp "target/${{ matrix.target }}/release/haru${ext}" dist/haru/
          cp LICENSE README.md README.ja.md dist/haru/
          if [ "${{ matrix.os_name }}" = windows ]; then
            (cd dist/haru && powershell -NoProfile -Command "Compress-Archive -Path * -DestinationPath ../out/${name}.zip")
          else
            tar -C dist/haru -czf "dist/out/${name}.tar.gz" .
          fi
          ls -l dist/out

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.os_name }}-${{ matrix.arch }}
          path: dist/out/*
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Checksums
        working-directory: dist
        run: sha256sum * > checksums.txt && cat checksums.txt
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
