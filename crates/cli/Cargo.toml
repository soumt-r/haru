[package]
name = "haru-cli"
description = "The haru command"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "haru_cli"
path = "src/lib.rs"

[[bin]]
name = "haru"
path = "src/main.rs"

[dependencies]
haru-core.workspace = true
haru-syntax.workspace = true
haru-std.workspace = true
haru-pkg-timezone = { path = "../../packages/timezone" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
sha2 = "0.10"

[dev-dependencies]
haru-example-greet = { path = "../../examples/greet" }
