[package]
name = "haru-pkg-http-server"
description = "The http_server package that comes with Haru"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "http_server"
# Linked into haru only (never loaded as a library), so no cdylib.
crate-type = ["rlib"]

[dependencies]
haru-sdk.workspace = true
socket2 = "0.5"
